name: Agentic MLOps Drift and Retraining Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      drift_detected: ${{ steps.drift.outputs.drift_detected }}
      psi: ${{ steps.drift.outputs.psi }}
      ks: ${{ steps.drift.outputs.ks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Audit dependencies
        continue-on-error: true
        run: |
          python -m pip install safety
          safety check --full-report || safety scan
      - name: Detect drift
        id: drift
        run: python monitor.py --baseline data/baseline_data.csv --current data/inference_data.csv
      - name: Save drift result
        if: always()
        run: |
          mkdir -p artifacts
          python monitor.py --baseline data/baseline_data.csv --current data/inference_data.csv > artifacts/drift-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-monitor-results
          path: artifacts/drift-result.json

  retrain:
    needs: monitor
    if: needs.monitor.outputs.drift_detected == 'true'
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_MODEL_NAME: investment-agent
      MSE_THRESHOLD: "2000"
      DRIFT_PSI: ${{ needs.monitor.outputs.psi }}
      DRIFT_KS: ${{ needs.monitor.outputs.ks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify MLflow registry connection
        run: |
          test -n "$MLFLOW_TRACKING_URI" || (echo "Set repository secret MLFLOW_TRACKING_URI to a reachable MLflow tracking/registry server" && exit 1)
          python -c "import mlflow; print('MLflow URI configured:', mlflow.get_tracking_uri())"
      - name: Profile and retrain from feedback
        run: python retrain.py --feedback-dir data/feedback --profile-out retrain.prof.txt
      - name: Upload profiling and training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-profile
          path: retrain.prof.txt
          if-no-files-found: warn
